<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIBAR 2026 · Valladolid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0d5b4f;
            --primary-light: #1a7d6d;
            --accent: #c9a961;
            --dark: #063d34;
            --light: #f8f8f8;
            --border: #e0e0e0;
            --text: #333;
            --success: #4caf50;
            --warning: #ff9800;
            --error: #f44336;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text: #f0f0f0;
                --light: #1a1a1a;
                --border: #333;
                --primary: #2a6d42;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 1.1em;
            color: #ccc;
            margin-bottom: 20px;
        }

        .countdown {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            padding: 20px 30px;
            border-radius: 12px;
            text-align: center;
            min-width: 120px;
            border: 2px solid var(--accent);
        }

        .countdown-number {
            font-size: 3em;
            font-weight: 900;
            color: var(--accent);
            line-height: 1;
            display: block;
        }

        .countdown-label {
            font-size: 0.9em;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
        }

        @media (prefers-color-scheme: dark) {
            .card {
                background: rgba(30, 30, 30, 0.9);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            }
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 20px;
            font-size: 1.3em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header:hover {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
        }

        .toggle-icon {
            font-size: 1.5em;
            transition: transform 0.3s ease;
        }

        .toggle-icon.open {
            transform: rotate(180deg);
        }

        .card-content {
            padding: 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .card-content.open {
            max-height: 2000px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9em;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--light);
            font-weight: 600;
            color: var(--primary);
        }

        tr:hover {
            background: var(--light);
        }

        @media (prefers-color-scheme: dark) {
            tr:hover {
                background: rgba(255, 255, 255, 0.05);
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: var(--accent);
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #f44336;
        }

        @media (prefers-color-scheme: dark) {
            .error {
                background: rgba(244, 67, 54, 0.1);
            }
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #ccc;
            font-size: 0.9em;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍹 FIBAR 2026</h1>
            <p>Gestión de Evento · Valladolid</p>
            <div class="countdown" id="countdown"></div>
        </header>

        <div id="loading" class="loading">Cargando datos desde Airtable...</div>
        <div id="error"></div>
        <div id="content" style="display: none;"></div>
    </div>

    <footer>
        <p>Datos sincronizados en tiempo real desde Airtable</p>
        <p>FIBAR 2026 © Altos Planos</p>
    </footer>

    <script>
        // Configuración de Airtable - LLAMADAS DIRECTAS
        const AIRTABLE_BASE_ID = 'appako5angOS2LFNw';
        const AIRTABLE_API_TOKEN = 'patxS2qWOs56SbirP';
        const AIRTABLE_API_URL = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}`;

        const tables = [
            { name: 'Presupuestos', icon: '💰' },
            { name: 'Equipos', icon: '👥' },
            { name: 'Viajes', icon: '✈️' },
            { name: 'Habitaciones', icon: '🏨' },
            { name: 'Turnos de Stand', icon: '🍹' },
            { name: 'Productos y Consumibles', icon: '🥃' },
            { name: 'POS y Merchandising', icon: '📦' }
        ];

        function initCountdown() {
            const eventDate = new Date('2026-08-15').getTime();

            function updateCountdown() {
                const now = new Date().getTime();
                const distance = eventDate - now;

                if (distance < 0) {
                    document.getElementById('countdown').innerHTML = '<div style="color: var(--accent); font-size: 1.5em;">¡El evento está aquí! 🎉</div>';
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

                document.getElementById('countdown').innerHTML = `
                    <div class="countdown-item">
                        <span class="countdown-number">${days}</span>
                        <span class="countdown-label">Días</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-number">${hours}</span>
                        <span class="countdown-label">Horas</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-number">${minutes}</span>
                        <span class="countdown-label">Minutos</span>
                    </div>
                `;
            }

            updateCountdown();
            setInterval(updateCountdown, 60000);
        }

        async function fetchTableData(tableName) {
            try {
                const response = await fetch(`${AIRTABLE_API_URL}/${encodeURIComponent(tableName)}`, {
                    headers: {
                        'Authorization': `Bearer ${AIRTABLE_API_TOKEN}`
                    }
                });

                if (!response.ok) {
                    console.error(`Error fetching ${tableName}:`, response.status);
                    return [];
                }

                const data = await response.json();
                return data.records.map(record => record.fields);
            } catch (error) {
                console.error(`Error fetching ${tableName}:`, error);
                return [];
            }
        }

        function createCard(title, data) {
            if (!data || data.length === 0) {
                return `
                    <div class="card">
                        <div class="card-header">
                            <span>${title}</span>
                            <span class="toggle-icon">▼</span>
                        </div>
                        <div class="card-content">
                            <p style="color: #999;">No hay datos disponibles</p>
                        </div>
                    </div>
                `;
            }

            const columns = Object.keys(data[0] || {});
            let tableHTML = `<table>
                <thead>
                    <tr>${columns.map(col => `<th>${col}</th>`).join('')}</tr>
                </thead>
                <tbody>`;

            data.forEach(item => {
                tableHTML += '<tr>';
                columns.forEach(col => {
                    const value = item[col] || '-';
                    tableHTML += `<td>${String(value).substring(0, 100)}</td>`;
                });
                tableHTML += '</tr>';
            });

            tableHTML += '</tbody></table>';

            return `
                <div class="card">
                    <div class="card-header" onclick="toggleCard(this)">
                        <span>${title} (${data.length})</span>
                        <span class="toggle-icon">▼</span>
                    </div>
                    <div class="card-content">
                        ${tableHTML}
                    </div>
                </div>
            `;
        }

        function toggleCard(header) {
            const content = header.nextElementSibling;
            const icon = header.querySelector('.toggle-icon');
            content.classList.toggle('open');
            icon.classList.toggle('open');
        }

        async function loadData() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('error').innerHTML = '';

                let html = '<div class="grid">';
                let foundData = false;

                for (const table of tables) {
                    const data = await fetchTableData(table.name);
                    if (data.length > 0) {
                        foundData = true;
                        html += createCard(`${table.icon} ${table.name}`, data);
                    }
                }

                if (!foundData) {
                    document.getElementById('error').innerHTML = `
                        <div class="error">
                            <strong>Atención:</strong> No se encontraron datos en las tablas de Airtable. Verifica que las tablas existen y contienen datos.
                        </div>
                    `;
                }

                html += '</div>';
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').innerHTML = html;
                document.getElementById('content').style.display = 'block';

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initCountdown();
            loadData();
            setInterval(loadData, 30000);
        });
    </script>
</body>
</html>
